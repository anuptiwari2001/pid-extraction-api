services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_TYPE: mssql
      DATABASE_URL: "mssql+pyodbc://sa:YourStrong!Passw0rd@mssql:1433/pid_extraction?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    ports:
      - "8000:8000"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - ./models_weights:/app/models_weights

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_TYPE: mssql
      DATABASE_URL: "mssql+pyodbc://sa:YourStrong!Passw0rd@mssql:1433/pid_extraction?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      USE_CELERY: "true"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - ./models_weights:/app/models_weights

volumes:
  mssql_data:
